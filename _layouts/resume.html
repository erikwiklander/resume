<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Erik Wiklander resume.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ page.title }} | Erik Wiklander</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201f;
      --muted: #5b6663;
      --line: #d9ded9;
      --paper: #ffffff;
      --wash: #f6f8f7;
      --accent: #0f766e;
      --accent-strong: #0b4f4a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.58;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration-color: rgba(15, 118, 110, 0.42);
      text-underline-offset: 0.18em;
    }

    a:hover {
      color: var(--accent-strong);
      text-decoration-color: currentColor;
    }

    .shell {
      width: min(880px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
    }

    .topbar .shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      gap: 20px;
    }

    .brand,
    .nav {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-weight: 760;
      text-decoration: none;
    }

    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-size: 0.82rem;
      line-height: 1;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 680;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: #fff;
    }

    .button.secondary {
      background: var(--paper);
      color: var(--accent-strong);
    }

    main {
      padding: 54px 0 76px;
    }

    .resume {
      max-width: 820px;
    }

    .resume h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .resume h2 {
      margin: 42px 0 14px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      font-size: 1.35rem;
      line-height: 1.12;
    }

    .resume h3 {
      margin: 30px 0 7px;
      font-size: 1.06rem;
      line-height: 1.2;
    }

    .resume p {
      margin: 0 0 13px;
      color: #2f3a38;
    }

    .resume ul {
      margin: 8px 0 16px;
      padding-left: 1.35rem;
    }

    .resume li + li {
      margin-top: 7px;
    }

    .resume strong {
      color: var(--ink);
    }

    .resume-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      margin-bottom: 26px;
    }

    .resume-header h1 {
      margin-bottom: 8px;
    }

    .resume-contact {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: right;
      white-space: nowrap;
    }

    .resume-headline {
      color: var(--accent-strong);
      font-size: 1.12rem;
      font-weight: 760;
      line-height: 1.2;
    }

    .resume table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 20px;
    }

    .resume td {
      width: 50%;
      padding: 9px 30px 9px 0;
      border-bottom: 1px solid var(--line);
      color: #2f3a38;
      vertical-align: top;
    }

    .resume td + td {
      padding-right: 0;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 720px) {
      .topbar .shell {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 0;
      }

      .nav {
        flex-wrap: wrap;
      }

      .resume-header {
        grid-template-columns: 1fr;
      }

      .resume-contact {
        text-align: left;
        white-space: normal;
      }

      main {
        padding-top: 38px;
      }
    }

    @media print {
      .topbar,
      .footer {
        display: none;
      }

      body {
        font-size: 10pt;
        line-height: 1.22;
      }

      main {
        padding: 0;
      }

      .shell,
      .resume {
        width: auto;
        max-width: none;
      }

      .resume h1 {
        font-size: 20pt;
      }

      .resume h2 {
        margin-top: 13pt;
        font-size: 12pt;
      }

      .resume h3 {
        margin-top: 9pt;
        font-size: 10.5pt;
      }

      .resume p,
      .resume li {
        color: #111;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <a class="brand" href="/" aria-label="Erik Wiklander">
        <span class="mark" aria-hidden="true">EW</span>
        <span>Erik Wiklander</span>
      </a>
      <nav class="nav" aria-label="Resume actions">
        <a class="button secondary" href="/">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="shell resume">
      <header class="resume-header">
        <div>
          <h1>{{ page.name }}</h1>
          <p class="resume-headline">{{ page.headline }}</p>
        </div>
        <div class="resume-contact">
          <div>{{ page.location }} &middot; {{ page.phone }}</div>
          <div><a href="mailto:{{ page.email }}">{{ page.email }}</a> &middot; <a href="{{ page.linkedin }}">linkedin.com/in/ewiklander</a></div>
        </div>
      </header>
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="shell">Erik Wiklander &middot; Software engineer &middot; Hands-on architect &middot; Austin, Texas</div>
  </footer>
</body>
</html>
